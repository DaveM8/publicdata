[project]
name = "dgi-explore"
version = "0.1.0"
description = "Index, link and explore the data.gov.ie mirror"
requires-python = ">=3.12"
dependencies = [
    "psycopg[binary]>=3.2",
    "ftfy>=6.2",
    "openpyxl>=3.1",
    "xlrd>=2.0",
    "pymupdf>=1.24",
    "trafilatura>=1.12",
    "openai>=1.50",
    "tiktoken>=0.7",
    "jinja2>=3.1",
    "numpy>=1.26",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "datasette>=0.64",
    "sqlite-utils>=3.36",
    "anthropic>=2.8.0",
    "markdown-it-py>=4.3.0",
]

[project.scripts]
dgi-explore = "dgi_explore.cli:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
