# nginx site for the Ask site. Copy to /etc/nginx/sites-available/ask, replace
# DOMAIN (twice) with the real name, link it into sites-enabled, then run
# certbot --nginx -d DOMAIN -d www.DOMAIN, which adds the HTTPS part.

# At most 6 new questions a minute from one address (bursts of 3), so one
# person or a script cannot run up the bill. Counted in memory, never logged.
limit_req_zone $binary_remote_addr zone=ask:10m rate=6r/m;

server {
    listen 80;
    listen [::]:80;
    server_name DOMAIN www.DOMAIN;

    # The site promises not to keep visitors' addresses: no access log.
    # Errors are still logged, without the address of whoever caused them.
    access_log off;
    error_log /var/log/nginx/ask-error.log crit;

    client_max_body_size 64k;

    location = /ask {
        limit_req zone=ask burst=3 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # The live steps of an answer (server-sent events): no buffering.
    location ~ ^/a/[^/]+/events$ {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 15m;
    }

    location / {
        proxy_pass http://127.0.0.1:8003;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
