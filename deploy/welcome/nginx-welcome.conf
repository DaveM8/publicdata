# Holding page for the domain until the Ask site goes live. Copy to
# /etc/nginx/sites-available/publicdata, link it into sites-enabled, then run
# certbot --nginx -d publicdata.ie -d www.publicdata.ie
# When the beta goes live, replace this file with nginx-ask.conf (deploy/beta/).

server {
    listen 80;
    listen [::]:80;
    server_name publicdata.ie www.publicdata.ie;

    # Same promise as the real site: no access log, so no visitors' addresses.
    access_log off;
    error_log /var/log/nginx/publicdata-error.log crit;

    root /var/www/publicdata;
    index index.html;

    location / {
        try_files $uri $uri/ =404;
    }
}
