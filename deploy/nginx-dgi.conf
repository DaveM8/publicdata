# dgi-explore web pages. Same allow-list as /org/: this machine, the home
# network, and Tailscale (for the colo). Installed as /etc/nginx/snippets/dgi-explore.conf
# and included from the default server block by deploy/sudo-setup.sh.

location /dgi/ {
    allow 127.0.0.1; allow ::1; allow 192.168.0.0/24; allow 100.64.0.0/10; deny all;
    charset utf-8;
    try_files $uri $uri/ =404;
}

location = /dgi/search {
    allow 127.0.0.1; allow ::1; allow 192.168.0.0/24; allow 100.64.0.0/10; deny all;
    proxy_pass http://127.0.0.1:8002;
    proxy_set_header Host $host;
}

location = /dgi/search.json {
    allow 127.0.0.1; allow ::1; allow 192.168.0.0/24; allow 100.64.0.0/10; deny all;
    proxy_pass http://127.0.0.1:8002;
}

location /datasette/ {
    allow 127.0.0.1; allow ::1; allow 192.168.0.0/24; allow 100.64.0.0/10; deny all;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
}

location /metabase/ {
    allow 127.0.0.1; allow ::1; allow 192.168.0.0/24; allow 100.64.0.0/10; deny all;
    proxy_pass http://127.0.0.1:3001/;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
}

# The Ask page (dgi-explore web, deploy/dgi-web.service). Same allow-list until
# it moves to its own public server. Buffering is off so the steps of an answer
# reach the browser as they happen.
location /ask/ {
    allow 127.0.0.1; allow ::1; allow 192.168.0.0/24; allow 100.64.0.0/10; deny all;
    proxy_pass http://127.0.0.1:8003;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_buffering off;
    proxy_read_timeout 300s;
}
